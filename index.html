<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon Museum</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #crosshair {
        position: fixed; top: 50%; left: 50%; width: 6px; height: 6px;
        margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.8);
        pointer-events: none;
      }
      #hint {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        color: rgba(255,255,255,0.85); font: 13px system-ui, sans-serif;
        background: rgba(0,0,0,0.45); padding: 6px 12px; border-radius: 6px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="hint">Click to look around · WASD to walk · click an exhibit to inspect · Esc to release mouse</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
