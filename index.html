<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon Museum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Same "night gallery" palette as the landing page (theunboundmuseum
           artifact) — the app chrome and the marketing page should read as
           one product, not two different visual identities. */
        --wall: #16130f;
        --wall-raised: #1e1a15;
        --ink: #ede6d8;
        --ink-soft: #bcb2a0;
        --brass: #c9a463;
        --brass-bright: #d9b877;
        --oxblood: #c96b62;
        --stone: #8f8574;
        --stone-line: #352f27;
        --card: #1e1a15;
        --shadow: rgba(0, 0, 0, 0.5);
      }
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: var(--wall); }
      body { font-family: "Work Sans", system-ui, sans-serif; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #crosshair {
        position: fixed; top: 50%; left: 50%; width: 5px; height: 5px;
        margin: -2.5px 0 0 -2.5px; border-radius: 50%;
        background: var(--brass-bright);
        box-shadow: 0 0 6px color-mix(in srgb, var(--brass-bright) 70%, transparent);
        pointer-events: none;
      }
      #hint {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        color: var(--ink-soft);
        font: 12px "IBM Plex Mono", ui-monospace, monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: color-mix(in srgb, var(--card) 90%, transparent);
        border: 1px solid var(--stone-line);
        padding: 8px 16px;
        border-radius: 3px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
